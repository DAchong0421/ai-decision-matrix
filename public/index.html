<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131e">
  <meta name="description" content="面向个人投资者的 AI 决策问答工作台。">
  <title>AI 决策矩阵</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231d2440'/%3E%3Cpath d='M14 44 27 31l8 8 15-19' fill='none' stroke='%237c8cff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='20' r='4' fill='%23c3a7ff'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#10121b;--panel:#171a27;--panel2:#1c2030;--line:rgba(174,184,221,.14);--text:#f4f5fb;--muted:#969bb0;--blue:#7788ff;--violet:#a48bff;--pink:#ee91b6;--green:#69d5ae;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 58% 0%,#242b4c 0%,#171a2b 34%,var(--bg) 76%);color:var(--text)}button,textarea{font:inherit}button{color:inherit}
    .app{min-height:100vh}.rail{position:fixed;inset:0 auto 0 0;width:78px;border-right:1px solid var(--line);background:rgba(13,15,22,.84);backdrop-filter:blur(18px);display:flex;align-items:center;flex-direction:column;z-index:5;padding:18px 0 16px}.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#303b70,#1e2240);display:grid;place-items:center;color:#b8c0ff;margin-bottom:26px;box-shadow:inset 0 0 0 1px #7988ff35}.brand-mark svg{width:23px;height:23px}.rail nav{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center}.nav-btn{width:46px;height:46px;border:0;border-radius:14px;background:transparent;color:#888da2;display:grid;place-items:center;cursor:pointer;transition:.18s}.nav-btn svg{width:21px;height:21px}.nav-btn:hover{background:#222638;color:#e8eaff}.nav-btn.active{background:#222b4c;color:#91a1ff;box-shadow:inset 0 0 0 1px #788aff28}.rail-spacer{flex:1}.rail-bottom{border-top:1px solid var(--line);padding-top:12px;width:100%;display:flex;justify-content:center}
    .shell{margin-left:78px;min-height:100vh;display:flex;flex-direction:column}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,4.5vw,68px);border-bottom:1px solid rgba(255,255,255,.045)}.wordmark{display:flex;gap:11px;align-items:center;font-size:15px;font-weight:650;letter-spacing:.02em}.wordmark .dot{width:8px;height:8px;border-radius:50%;background:#8291ff;box-shadow:0 0 14px #8291ff}.top-actions{display:flex;gap:10px}.top-btn{background:rgba(255,255,255,.045);border:1px solid rgba(193,200,230,.17);border-radius:11px;padding:9px 15px;font-size:13px;color:#d9dced;cursor:pointer;transition:.18s}.top-btn:hover{background:rgba(255,255,255,.09);border-color:#7788ff72}.top-btn.wallet{display:flex;gap:7px;align-items:center}.top-btn svg{width:16px;height:16px}
    main{width:min(860px,calc(100% - 48px));margin:0 auto;padding:clamp(44px,8vh,86px) 0 48px;flex:1}.intro{text-align:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#b0b7d8;border:1px solid #858eff2c;background:#7b83ff0d;border-radius:999px;padding:7px 12px;font-size:12px;letter-spacing:.04em}.eyebrow i{width:6px;height:6px;background:#9a8fff;border-radius:50%;box-shadow:0 0 10px #9388ff}.intro h1{font-size:clamp(30px,4.2vw,48px);line-height:1.15;letter-spacing:-.035em;margin:20px 0 12px;font-weight:720}.intro p{color:#a5a9bc;font-size:15px;line-height:1.7;margin:0 auto;max-width:590px}.feature-row{margin:30px auto 28px;display:flex;gap:13px 22px;align-items:center;justify-content:center;flex-wrap:wrap;color:#d8dbea;font-size:14px}.feature{display:flex;gap:8px;align-items:center}.check{color:#858fff;font-size:16px;font-weight:700}
    .mode-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 auto 18px}.mode{position:relative;min-height:64px;padding:12px 10px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;color:#dce0f0;transition:transform .18s,border-color .18s,background .18s}.mode:hover{transform:translateY(-2px);border-color:#8995ff8a}.mode.active{border-color:#7687ff;background:linear-gradient(145deg,#323a69aa,#262c4c88);box-shadow:0 0 0 1px #7687ff18,inset 0 0 30px #6576ff0d}.mode[data-mode="deep"]{border-color:#ed91b66c}.mode[data-mode="deep"].active{background:linear-gradient(145deg,#49304a,#30263e);box-shadow:inset 0 0 28px #ed91b60c}.mode-icon{font-size:18px}.mode-label{font-size:13px;font-weight:620;white-space:nowrap}.mode-hint{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);font-size:11px;color:#82879b;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}.mode:hover .mode-hint{opacity:1}
    .composer{position:relative;border:1px solid rgba(175,184,224,.2);border-radius:20px;background:linear-gradient(145deg,rgba(31,35,53,.94),rgba(24,27,41,.94));box-shadow:0 20px 65px #06070e50,inset 0 1px rgba(255,255,255,.04);padding:19px 20px 14px}.composer:focus-within{border-color:#8390ff91;box-shadow:0 20px 65px #06070e50,0 0 0 3px #798aff16}.composer textarea{display:block;width:100%;min-height:55px;max-height:180px;resize:vertical;background:transparent;border:0;outline:0;color:#f6f6fb;font-size:15px;line-height:1.65;padding:0 52px 8px 0}.composer textarea::placeholder{color:#868ba0}.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}.composer-note{font-size:11px;color:#7f8498;display:flex;align-items:center;gap:7px}.send{position:absolute;right:16px;bottom:14px;width:43px;height:43px;border-radius:14px;border:1px solid #b5bcff24;background:linear-gradient(145deg,#414a79,#313956);color:#cbd1ff;display:grid;place-items:center;cursor:pointer;transition:.18s}.send:hover{background:linear-gradient(145deg,#5966aa,#424c7a);transform:translateY(-1px)}.send:disabled{opacity:.4;cursor:not-allowed;transform:none}.send svg{width:18px;height:18px}
    .popular{margin-top:32px}.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-heading h2{font-size:15px;margin:0;font-weight:650}.section-heading span{font-size:11px;color:#7f8498}.question-list{display:grid;gap:9px}.question{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid rgba(176,185,222,.13);border-radius:15px;background:rgba(255,255,255,.026);color:#e4e6f1;cursor:pointer;transition:.18s}.question:hover{border-color:#818dff65;background:rgba(100,115,210,.09);transform:translateX(2px)}.qtag{flex:0 0 auto;width:35px;height:35px;border-radius:12px;background:#30385f;color:#aeb8ff;display:grid;place-items:center;font-size:11px;font-weight:720}.qtext{font-size:13px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.arrow{color:#7d84a0;font-size:18px}.status-note{text-align:center;color:#777d91;font-size:11px;margin:20px auto 0;line-height:1.6}.status-note strong{color:#aeb3c8;font-weight:550}.conversation{display:none;margin:0 auto 22px;max-width:720px}.conversation.visible{display:block}.user-bubble{margin-left:auto;max-width:88%;width:fit-content;padding:14px 17px;border:1px solid #8290ff3d;background:#273052;border-radius:16px 16px 4px 16px;font-size:14px;line-height:1.6;white-space:pre-wrap}.assistant-card{margin-top:16px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:16px;padding:18px 20px;color:#d2d6e5;font-size:13px;line-height:1.75}.assistant-card strong{color:#f1f2fa}.assistant-card .notice{margin-top:12px;padding:11px 12px;background:#d7a34912;border:1px solid #d7a34930;border-radius:11px;color:#dfc58f;font-size:12px}.assistant-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;color:#eff0f8;font-weight:650}.ai-avatar{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(145deg,#5967b4,#5a477b);font-size:12px}.empty-state{text-align:center;padding:16px;color:#8d92a5;font-size:13px}
    .footer{padding:16px 24px 20px;text-align:center;color:#686e82;font-size:11px}.footer a{color:#9097b4;text-decoration:none}.modal-backdrop{position:fixed;inset:0;background:#05060bd1;z-index:10;display:none;place-items:center;padding:18px;backdrop-filter:blur(8px)}.modal-backdrop.open{display:grid}.modal{width:min(390px,100%);border:1px solid #a9b3ed25;border-radius:20px;background:#1a1d2b;padding:24px;box-shadow:0 28px 80px #0009}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal h2{font-size:18px;margin:0}.close{border:0;background:transparent;color:#a5abc0;font-size:24px;cursor:pointer}.wallet-balance{padding:18px;border:1px solid var(--line);background:#ffffff06;border-radius:14px;color:#9ba1b7;font-size:13px}.wallet-balance strong{display:block;color:white;font-size:26px;margin-top:7px}.modal p{font-size:12px;color:#858ba0;line-height:1.65;margin:15px 0 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:20;padding:11px 15px;border:1px solid #a9b3ed2e;border-radius:12px;background:#252a3b;color:#e4e7f3;font-size:12px;box-shadow:0 12px 35px #0007;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .answer-body{white-space:pre-wrap;overflow-wrap:anywhere}.answer-body a,.source-list a{color:#aebaff;text-decoration:underline;text-underline-offset:3px}.response-meta{margin-top:15px;color:#9299b2;font-size:12px}.source-list{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}.source-list a{font-size:12px;border:1px solid #8e9bff35;border-radius:999px;padding:4px 9px;text-decoration:none}.access-field{display:block;width:100%;margin-top:16px;padding:12px 13px;background:#111522;color:#f4f5fb;border:1px solid #8793d054;border-radius:11px;font:inherit}.access-submit{width:100%;margin-top:12px;padding:11px;border:0;border-radius:11px;background:#7687ff;color:#101327;font-weight:700;cursor:pointer}.access-submit:hover{background:#9ba8ff}
    @media(max-width:650px){.rail{width:64px;padding:15px 0}.brand-mark{width:38px;height:38px;margin-bottom:20px}.nav-btn{width:42px;height:42px}.shell{margin-left:64px}.topbar{height:62px;padding:0 16px}.wordmark{font-size:13px}.top-btn{padding:8px 11px;font-size:12px}.top-btn.wallet{padding:8px 10px}main{width:calc(100% - 30px);padding:50px 0 26px}.intro h1{font-size:30px;margin-top:18px}.intro p{font-size:13px}.feature-row{font-size:12px;gap:10px 15px;margin:24px auto}.mode-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.mode{min-height:56px;border-radius:14px}.mode-label{font-size:12px}.composer{padding:15px 14px 13px;border-radius:17px}.composer textarea{font-size:14px;min-height:62px;padding-right:46px}.send{width:39px;height:39px;right:12px;bottom:11px}.popular{margin-top:26px}.question{padding:10px 11px;gap:9px}.qtag{width:32px;height:32px}.qtext{font-size:12px}.status-note{font-size:10px}.footer{padding-bottom:24px}}
    @media(max-width:390px){.rail{width:56px}.shell{margin-left:56px}.topbar{padding:0 10px}.wordmark{gap:7px;font-size:12px}.top-btn{padding:7px 9px}.intro h1{font-size:27px}.feature-row{gap:9px 11px}.mode-icon{font-size:16px}.mode-label{font-size:11px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="主导航">
      <div class="brand-mark" aria-label="AI 决策矩阵">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 17.5 8.2 12l3.5 3.3L20.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 6h4.5v4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <nav>
        <button class="nav-btn active" aria-label="AI问答" title="AI问答"><svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20h-6v-6h-4v6H4v-9.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
        <button class="nav-btn" aria-label="股票搜索" title="股票搜索"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        <button class="nav-btn" aria-label="行情分析" title="行情分析"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V5m0 14h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="m7 15 3.5-4 3 2 5-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 7h2.5v2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="nav-btn" aria-label="策略面板" title="策略面板"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4" width="17" height="12.5" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M7 20h10M12 16.5V20m-5-7 3-3 2.5 2 4-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="nav-btn" aria-label="自选股" title="自选股"><svg viewBox="0 0 24 24" fill="none"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.9-5.4 2.9 1-6-4.4-4.3 6.1-.9L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
        <button class="nav-btn" aria-label="消息" title="消息"><svg viewBox="0 0 24 24" fill="none"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.6 8.6 0 0 1-3.7-.8L4 20l1.2-3.6A7.1 7.1 0 0 1 4 12.5 7.5 7.5 0 0 1 12 5a7.5 7.5 0 0 1 8 6.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></button>
      </nav>
      <div class="rail-spacer"></div>
      <div class="rail-bottom"><button class="nav-btn" aria-label="个人空间" title="个人空间"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6.5h14a2 2 0 0 1 2 2V19H6a2 2 0 0 1-2-2V6.5Zm0 0V5a2 2 0 0 1 2-2h11" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.5 12h4.3" stroke="currentColor" stroke-width="1.7"/></svg></button></div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div class="wordmark"><span class="dot"></span><span>AI 决策矩阵</span></div>
        <div class="top-actions">
          <button class="top-btn" id="newChat" type="button">新对话</button>
          <button class="top-btn wallet" id="openWallet" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.5h14a2 2 0 0 1 2 2V19H6a2 2 0 0 1-2-2V6.5Zm0 0V5a2 2 0 0 1 2-2h11" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.5 12h4.3" stroke="currentColor" stroke-width="1.7"/></svg>钱包</button>
        </div>
      </header>
      <main>
        <section class="intro" id="welcome">
          <span class="eyebrow"><i></i>个人投资研究工作台</span>
          <h1>向 AI 决策矩阵提问</h1>
          <p>结合行情、趋势与公司信息，整理值得关注的线索和风险。</p>
          <div class="feature-row" aria-label="功能特点">
            <span class="feature"><span class="check">✓</span>自选股分析</span>
            <span class="feature"><span class="check">✓</span>实时行情</span>
            <span class="feature"><span class="check">✓</span>收盘因子</span>
            <span class="feature"><span class="check">✓</span>公告/舆情风险</span>
          </div>
        </section>
        <section class="conversation" id="conversation" aria-live="polite"></section>
        <section class="mode-row" aria-label="分析模式">
          <button class="mode" data-mode="search" type="button"><span class="mode-icon">⌕</span><span class="mode-label">实时搜索</span><span class="mode-hint">联网检索行情与公开信息</span></button>
          <button class="mode active" data-mode="quick" type="button"><span class="mode-icon">⚡</span><span class="mode-label">快速模式</span><span class="mode-hint">快速整理核心观点</span></button>
          <button class="mode" data-mode="expert" type="button"><span class="mode-icon">◈</span><span class="mode-label">专家模式</span><span class="mode-hint">结构化拆解多项指标</span></button>
          <button class="mode" data-mode="deep" type="button"><span class="mode-icon">✺</span><span class="mode-label">深度思考</span><span class="mode-hint">多角度推演与风险复核</span></button>
        </section>
        <form class="composer" id="chatForm">
          <label class="sr-only" for="question">输入你的问题</label>
          <textarea id="question" rows="2" placeholder="输入股票名称、代码或你的问题…"></textarea>
          <div class="composer-foot"><span class="composer-note"><span class="check">✦</span>把问题说具体，分析会更贴近你的需求</span></div>
          <button class="send" id="sendButton" type="submit" aria-label="发送问题"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m21 3-7.2 18-3.7-7.1L3 10.2 21 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.1 13.9 21 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        </form>
        <section class="popular" id="popular">
          <div class="section-heading"><h2>热门问句</h2><span>点击后可修改再发送</span></div>
          <div class="question-list">
            <button class="question" type="button" data-question="结合最新行情，分析【股票名称】目前的趋势、关键支撑和主要风险。"><span class="qtag">Q1</span><span class="qtext">结合最新行情，分析【股票名称】目前的趋势、关键支撑和主要风险。</span><span class="arrow">›</span></button>
            <button class="question" type="button" data-question="【股票名称】现价还能不能参与？请从趋势、位置和风险三方面分析。"><span class="qtag">Q2</span><span class="qtext">【股票名称】现价还能不能参与？按趋势、位置和风险分析。</span><span class="arrow">›</span></button>
            <button class="question" type="button" data-question="我想做【股票名称】的1到2天短线，当前需要观察哪些信号？"><span class="qtag">Q3</span><span class="qtext">我想做【股票名称】的1到2天短线，当前需要观察哪些信号？</span><span class="arrow">›</span></button>
            <button class="question" type="button" data-question="我持有【股票名称】，成本约【成本价】，请帮我梳理接下来应关注的条件。"><span class="qtag">Q4</span><span class="qtext">我现在持有【股票名称】，成本约【成本价】，接下来应关注什么？</span><span class="arrow">›</span></button>
            <button class="question" type="button" data-question="请整理【股票名称】近期的重要公告、业绩变化和潜在风险。"><span class="qtag">Q5</span><span class="qtext">请整理【股票名称】近期公告、业绩变化和潜在风险。</span><span class="arrow">›</span></button>
          </div>
        </section>
        <p class="status-note"><strong>研究辅助</strong> · 联网分析引用公开网页；尚未接入交易所实时行情，交易前请核实报价。</p>
      </main>
      <footer class="footer">信息仅用于研究参考，市场有风险，投资需谨慎。</footer>
    </div>
  </div>
  <div class="modal-backdrop" id="walletModal" role="dialog" aria-modal="true" aria-labelledby="walletTitle">
    <div class="modal"><div class="modal-head"><h2 id="walletTitle">我的钱包</h2><button class="close" type="button" id="closeWallet" aria-label="关闭">×</button></div><div class="wallet-balance">可用额度<strong>—</strong></div><p>钱包和额度管理将在接入账户服务后开放。此演示页面不会收集或保存支付信息。</p></div>
  </div>
  <div class="modal-backdrop" id="accessModal" role="dialog" aria-modal="true" aria-labelledby="accessTitle">
    <div class="modal"><div class="modal-head"><h2 id="accessTitle">输入访问码</h2><button class="close" type="button" id="closeAccess" aria-label="关闭">×</button></div><p>为保护分析额度，首次提问需要输入站点访问码。访问码仅保存在当前浏览器会话。</p><form id="accessForm"><label class="sr-only" for="accessCode">站点访问码</label><input class="access-field" id="accessCode" type="password" autocomplete="off" placeholder="站点访问码" required><button class="access-submit" type="submit">开始分析</button></form></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const modes = {
        search: { label: '实时搜索', model: 'gpt-6-sol', effort: 'low', add: 'Responses API + 联网搜索/行情工具' },
        quick: { label: '快速模式', model: 'gpt-6-luna', effort: 'none', add: 'Responses API' },
        expert: { label: '专家模式', model: 'gpt-6-sol', effort: 'medium', add: 'Responses API + 结构化分析' },
        deep: { label: '深度思考', model: 'gpt-6-astra', effort: 'high', add: 'Responses API + 多步风险复核' }
      };
      let selectedMode = 'quick';
      const form = document.getElementById('chatForm');
      const question = document.getElementById('question');
      const conversation = document.getElementById('conversation');
      const welcome = document.getElementById('welcome');
      const popular = document.getElementById('popular');
      const modal = document.getElementById('walletModal');
      const accessModal = document.getElementById('accessModal');
      const accessForm = document.getElementById('accessForm');
      const accessCodeInput = document.getElementById('accessCode');
      const sendButton = document.getElementById('sendButton');
      const toast = document.getElementById('toast');
      const apiUrl = window.AI_MATRIX_API_URL || '/api/analyze';
      let accessCode = sessionStorage.getItem('ai_matrix_access_code') || '';
      let busy = false;
      let toastTimer;
      const showToast = (message) => {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
      };
      document.querySelectorAll('.mode').forEach((button) => {
        button.setAttribute('aria-pressed', button.dataset.mode === selectedMode ? 'true' : 'false');
        button.addEventListener('click', () => {
          selectedMode = button.dataset.mode;
          document.querySelectorAll('.mode').forEach((item) => {
            const active = item === button;
            item.classList.toggle('active', active);
            item.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
        });
      });
      document.querySelectorAll('.question').forEach((button) => {
        button.addEventListener('click', () => {
          question.value = button.dataset.question;
          question.focus();
          question.setSelectionRange(question.value.indexOf('【'), question.value.indexOf('】') + 1);
        });
      });
      const appendAnswer = (target, answer, citations) => {
        const inline = citations.filter((item) => Number.isInteger(item.start) && Number.isInteger(item.end) && item.start >= 0 && item.end > item.start && item.end <= answer.length && /^https?:\/\//i.test(item.url)).sort((a, b) => a.start - b.start);
        let cursor = 0;
        for (const item of inline) {
          if (item.start < cursor) continue;
          target.append(document.createTextNode(answer.slice(cursor, item.start)));
          const link = document.createElement('a');
          link.href = item.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = answer.slice(item.start, item.end);
          link.title = item.title || item.url;
          target.append(link);
          cursor = item.end;
        }
        target.append(document.createTextNode(answer.slice(cursor)));
      };
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (busy) return;
        const prompt = question.value.trim();
        if (!prompt) {
          question.focus();
          showToast('先写下你想了解的问题');
          return;
        }
        if (prompt.length > 2000) {
          showToast('问题请控制在 2000 字以内');
          return;
        }
        if (!accessCode) {
          accessModal.classList.add('open');
          accessCodeInput.focus();
          return;
        }
        const route = modes[selectedMode];
        conversation.replaceChildren();
        const userBubble = document.createElement('div');
        userBubble.className = 'user-bubble';
        userBubble.textContent = prompt;
        const response = document.createElement('article');
        response.className = 'assistant-card';
        const head = document.createElement('div');
        head.className = 'assistant-head';
        head.innerHTML = '<span class="ai-avatar" aria-hidden="true">AI</span><span>正在分析…</span>';
        response.append(head);
        conversation.append(userBubble, response);
        conversation.classList.add('visible');
        welcome.hidden = true;
        popular.hidden = true;
        busy = true;
        sendButton.disabled = true;
        conversation.scrollIntoView({ behavior: 'smooth', block: 'start' });
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 65000);
        try {
          const apiResponse = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Site-Access': accessCode },
            body: JSON.stringify({ question: prompt, mode: selectedMode }),
            signal: controller.signal
          });
          const data = await apiResponse.json();
          if (!apiResponse.ok) {
            if (apiResponse.status === 401) {
              accessCode = '';
              sessionStorage.removeItem('ai_matrix_access_code');
              accessModal.classList.add('open');
              accessCodeInput.focus();
            }
            throw new Error(data.error || '分析失败，请稍后重试。');
          }
          head.querySelector('span:last-child').textContent = `${route.label}分析`;
          const body = document.createElement('div');
          body.className = 'answer-body';
          appendAnswer(body, data.answer, data.citations || []);
          const meta = document.createElement('div');
          meta.className = 'response-meta';
          meta.textContent = `${data.model} · ${new Date(data.generatedAt).toLocaleString('zh-CN')} · ${data.searched ? '参考公开网页' : '未联网搜索'}`;
          response.append(body, meta);
          const sources = [...new Map((data.citations || []).filter((item) => /^https?:\/\//i.test(item.url)).map((item) => [item.url, item])).values()];
          if (sources.length) {
            const sourceList = document.createElement('div');
            sourceList.className = 'source-list';
            for (const [index, item] of sources.entries()) {
              const link = document.createElement('a');
              link.href = item.url;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = `来源 ${index + 1}：${item.title || new URL(item.url).hostname}`;
              sourceList.append(link);
            }
            response.append(sourceList);
          }
          question.value = '';
        } catch (error) {
          head.querySelector('span:last-child').textContent = '分析未完成';
          const notice = document.createElement('div');
          notice.className = 'notice';
          notice.textContent = error.name === 'AbortError' ? '等待时间过长，请缩短问题或换一个模式再试。' : (error.message || '网络暂时不可用，请稍后再试。');
          response.append(notice);
        } finally {
          clearTimeout(timer);
          busy = false;
          sendButton.disabled = false;
        }
      });
      accessForm.addEventListener('submit', (event) => {
        event.preventDefault();
        accessCode = accessCodeInput.value.trim();
        if (!accessCode) return;
        sessionStorage.setItem('ai_matrix_access_code', accessCode);
        accessCodeInput.value = '';
        accessModal.classList.remove('open');
        form.requestSubmit();
      });
      document.getElementById('closeAccess').addEventListener('click', () => accessModal.classList.remove('open'));
      accessModal.addEventListener('click', (event) => { if (event.target === accessModal) accessModal.classList.remove('open'); });
      document.getElementById('newChat').addEventListener('click', () => {
        conversation.replaceChildren();
        conversation.classList.remove('visible');
        welcome.hidden = false;
        popular.hidden = false;
        question.value = '';
        question.focus();
      });
      document.getElementById('openWallet').addEventListener('click', () => modal.classList.add('open'));
      document.getElementById('closeWallet').addEventListener('click', () => modal.classList.remove('open'));
      modal.addEventListener('click', (event) => { if (event.target === modal) modal.classList.remove('open'); });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') modal.classList.remove('open');
        if (event.key === 'Escape') accessModal.classList.remove('open');
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && document.activeElement === question) form.requestSubmit();
      });
      document.querySelectorAll('.nav-btn').forEach((button) => {
        button.addEventListener('click', () => {
          if (button.getAttribute('aria-label') !== 'AI问答') showToast(`${button.getAttribute('aria-label')}模块将在后续版本开放`);
        });
      });
    })();
  </script>
</body>
</html>
